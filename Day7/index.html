<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <style>
        ins{
            background-color: rgb(11, 228, 58);
            text-decoration: underline;
            /* text-decoration: line-through; */
        }

    </style>
</head>

<body>
    <h2>
        Tasks
    </h2>
    <ol>
        <li>wake up</li>
    </ol>
    <input type="text" id="task">
    <button id="add__task__button">Add Task</button>
    <script>
        let getOlElement = document.querySelector('body').querySelector('ol')
        let getLiElements = document.querySelector('body').querySelector('ol').children
        let myInput = document.getElementById('task');

        const myButton = document.getElementById('add__task__button');
        myButton.addEventListener('click', function () {
            const getInputValue = myInput.value;
            if (getInputValue !== "") {
                const insElement = document.createElement('ins'); 
                const newLi = document.createElement('li');
                insElement.textContent = getInputValue;
                newLi.appendChild(insElement);
                getOlElement.appendChild(newLi);

                myInput.value = "";
                for(let i = 0; i < getLiElements.length - 1; i++){
                    let delElement = getLiElements[i].querySelector('del');
                    if(!delElement){
                        const text = getLiElements[i].textContent;
                        const newDel = document.createElement('del');
                        newDel.textContent = text;
                        getLiElements[i].replaceChildren(newDel);
                        delElement = newDel
                    }
                    delElement.style.backgroundColor = 'rgb(224, 107, 107)';
                    delElement.style.textDecoration = 'line-through';
                }

            }
            else {
                console.log("el input esta vacio")
            }
        })
    </script>
</body>

</html>
